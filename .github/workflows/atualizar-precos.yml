name: Atualiza precos

on:
  schedule:
    # Quinta-feira, 03:00 em Brasilia (UTC-3) = 06:00 UTC
    - cron: "0 6 * * 4"
  workflow_dispatch:        # permite rodar na mao pela aba Actions

# Necessario para o passo de commit escrever no repositorio
permissions:
  contents: write

concurrency:
  group: atualiza-precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixa o repositorio
        uses: actions/checkout@v4

      - name: Prepara o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualiza o catalogo do Mateus
        run: python atualizar_precos.py

      # continue-on-error: uma loja fora do ar nao pode impedir que a
      # outra seja atualizada e commitada
      - name: Atualiza o catalogo do Atacadao
        continue-on-error: true
        run: python atualizar_atacadao.py

      - name: Commita se houve mudanca
        run: |
          if git diff --quiet -- produtos_v2.json produtos_atacadao.json; then
            echo "Nenhuma mudanca nos catalogos - nada a commitar."
            exit 0
          fi

          conta() {
            python -c "import json;print(len(json.load(open('$1',encoding='utf-8'))['produtos']))"
          }
          hoje=$(TZ=America/Sao_Paulo date +%d/%m/%Y)

          partes=""
          if ! git diff --quiet -- produtos_v2.json; then
            partes="Mateus $(conta produtos_v2.json)"
          fi
          if ! git diff --quiet -- produtos_atacadao.json; then
            [ -n "$partes" ] && partes="$partes, "
            partes="${partes}Atacadao $(conta produtos_atacadao.json)"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add produtos_v2.json produtos_atacadao.json
          git commit -m "Atualiza catalogos: ${partes} produtos (${hoje})"
          git push
